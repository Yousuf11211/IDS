# All paths are relative to pipeline/, regardless of the working directory.
[worker]
data_dir = "data"
batch_size = 500
poll_seconds = 2
max_attempts = 5
retry_seconds = 10
# Plain CSV drops are claimed after their size and modification time settle.
# An empty filename.csv.ready marker allows immediate pickup.
require_ready_marker = false
file_settle_seconds = 4
# IANA timezone for CSV timestamps without an offset. Empty requires an explicit offset.
source_timezone = "America/Chicago"

[database]
# Read the SAME connection configuration as IDS/Program.cs; no separate database.
webapp_dir = "../IDS"
environment = "Development"
odbc_driver = "auto" # Prefer installed Driver 18, otherwise Driver 17.

[models]
gatekeeper = "models/gatekeeper/binary.ubj"
gatekeeper_labels = "models/gatekeeper/binary_label_mapping.json"
multiclass = "models/multiclass/multiclass.ubj"
multiclass_labels = "models/multiclass/multiclass_label_mapping.json"
feature_list = "Features_used/features_used.json"
attack_policy = "config/attack-policy-v2.json"
gatekeeper_threshold = 0.5
# 0 uses the highest-scoring mapped attack class; increase to enable UnknownAttack.
multiclass_threshold = 0.0
# Aggregate profile of the verified Experiment D benign training rows.
reference_profile = "config/benign-reference.json"
