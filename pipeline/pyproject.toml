[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ids-csv-pipeline"
version = "0.1.0"
description = "Recoverable two-stage CSV detection worker for IDS"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
sqlserver = ["pyodbc>=5,<6"]
sklearn = ["joblib>=1.3,<2", "pandas>=2,<3", "scikit-learn>=1.4,<2"]

[tool.setuptools]
packages = ["ids_pipeline"]
