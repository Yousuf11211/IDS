<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;padding:20px;background:#f1f5f9;color:#172033;font:16px/1.6 Arial,sans-serif">
  <main style="box-sizing:border-box;max-width:580px;margin:auto;background:#fff;border:1px solid #dbe3ee;border-radius:10px;padding:24px">
    <p style="font-weight:700;color:#1754a3;margin:0">IDS Security</p>
    <h1 style="font-size:22px;line-height:1.3">{Title}</h1>
    <p>Hello {Name},</p>
    <p>{Description}</p>
    <p>Event time · {OccurredAt}</p>
    <p><a style="color:#1754a3;font-weight:700" href="{ActionUrl}">{ActionLabel}</a></p>
    <p>{Warning}</p>
    <p style="border-top:1px solid #dbe3ee;padding-top:12px;margin-bottom:0">Support · {Contact}</p>
  </main>
</body></html>
